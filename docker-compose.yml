services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Kairos
    volumes:
      - kairos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Kairos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Port=5432;User Id=postgres;Password=postgres;Database=Kairos;Pooling=true;CommandTimeout=120;Timeout=30"

      # Requests arrive from the Docker gateway, not loopback, so the local-only
      # fallback would refuse everything. These are development values - replace
      # them before exposing this to anything.
      Kairos__Dashboard__Username: admin
      Kairos__Dashboard__Password: admin
      Kairos__Api__Keys__0: dev-api-key

      # Callbacks to other compose services (http://your-app:3000/hook) resolve to
      # private addresses, so the SSRF guard has to be relaxed for local testing.
      Kairos__Callbacks__AllowPrivateNetworks: "true"
      Kairos__Callbacks__SigningSecret: dev-signing-secret

volumes:
  kairos-db:
